name: tests

on:
  workflow_dispatch:
  # A branch with an open pull request would otherwise be built twice: once for the
  # push and once for the pull request.
  push:
    branches: [main]
  pull_request:

# Supersede the runs still going for older commits on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal:
    name: Internal support tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: uv run --python 3.12 --with pytest pytest

  yae-main-integration:
    name: YAE main integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out yae-support
        uses: actions/checkout@v4
        with:
          path: yae-support
      - name: Check out YAE
        uses: actions/checkout@v4
        with:
          repository: Sunday111/yae
          path: yae
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run integration tests
        working-directory: yae
        run: uv run --project . pytest
        env:
          YAE_SUPPORT_ROOT: ${{ github.workspace }}/yae-support
      - name: Run generated-project integration
        working-directory: yae
        run: uv run --project . yae self-test
        env:
          YAE_SUPPORT_ROOT: ${{ github.workspace }}/yae-support
